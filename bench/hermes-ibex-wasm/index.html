<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hermes VM WebAssembly: JSI HBC runtime</title></head>
<body>
<h1>Hermes VM in Chromium</h1><p id="result">PENDING</p><pre id="details"></pre>
<script src="./hermes.js"></script>
<script>
(async function () {
  const state = document.getElementById("result");
  const details = document.getElementById("details");
  const out = [], errors = [];
  try {
    if (typeof CreateHermesVM !== "function") throw Error("Hermes JSI factory missing");
    const vm = await CreateHermesVM({
      locateFile: name => "./" + name,
      print: line => out.push(String(line)),
      printErr: line => errors.push(String(line))
    });
    const response = await fetch("./shared.hbc");
    if (!response.ok) throw Error("HBC HTTP status " + response.status);
    const bytes = new Uint8Array(await response.arrayBuffer());
    if (bytes.length < 32) throw Error("Invalid HBC: " + bytes.length);
    vm.FS.writeFile("/shared.hbc", bytes);
    const checksum = vm.ccall("hermes_run_hbc_file", "number", ["string"], ["/shared.hbc"]);
    details.textContent = "bytecode_bytes=" + bytes.length +
      "\nhermes_jsi_checksum=" + checksum + "\n" + out.join("\n");
    if (checksum !== 479820 ||
        !out.some(line => line.includes("HERMES_SHARED_OK=479820"))) {
      throw Error("Unexpected JSI Hermes return code: " + checksum +
        ", stderr=" + errors.join("\n"));
    }
    state.textContent = "PASS HERMES_SHARED_OK=479820";
    state.dataset.status = "pass";
  } catch (error) {
    state.textContent = "FAIL " + String(error && error.stack || error);
    state.dataset.status = "fail";
    details.textContent = errors.join("\n");
  }
}());
</script>
</body>
</html>
