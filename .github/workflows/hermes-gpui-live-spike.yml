name: Live Hermes HBC JSI mutation to Rust scene
on:
  workflow_dispatch:
  push:
    branches: [feature/gpui-frame-bench]
    paths:
      - 'crates/hermes-gpui-spike/**'
      - '.github/workflows/hermes-gpui-live-spike.yml'
permissions:
  contents: read
jobs:
  live-hermes-mutation-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.97.0'
          cache: false
      - name: Install native Hermes build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y clang cmake ninja-build libicu-dev pkg-config
      - name: Execute HBC and deliver its dynamic mutation batch through JSI into Rust
        run: |
          mkdir -p results/gpui-hermes-spike
          cargo run --locked --manifest-path crates/hermes-gpui-spike/Cargo.toml --release \
            | tee results/gpui-hermes-spike/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-hermes-jsi-rust-mutation-evidence
          path: |
            crates/hermes-gpui-spike/Cargo.lock
            crates/hermes-gpui-spike/target/gpui-live-probe.hbc
            results/gpui-hermes-spike/runtime.log
          retention-days: 14
