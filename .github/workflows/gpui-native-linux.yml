name: Real GPUI Linux windows from Hermes Svelte and Solid scenes
on:
  push:
    branches: [main]
    paths:
      - 'platforms/native/**'
      - '.github/workflows/gpui-native-linux.yml'
  workflow_dispatch:
    inputs:
      live_hermes:
        description: "Run in-process Hermes HBC / JSI / Rust Scene inside real GPUI windows"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
jobs:
  gpui-linux-window:
    if: ${{ !inputs.live_hermes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: v1.29.3
          path: .zed-source
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Install GPUI X11, Mesa, fonts, Xvfb and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev libasound2-dev \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri \
            xvfb xauth xdotool imagemagick python3-pil
      - name: Download actual Hermes framework scene artifacts
        uses: actions/download-artifact@v4
        with:
          name: real-ibex2-hermes-framework-benchmarks
          run-id: 45195497003
          github-token: ${{ github.token }}
          path: results/hermes
      - name: Place the scene-driven test inside official Zed GPUI example slot
        run: |
          cp platforms/native/bench_view.rs .zed-source/crates/gpui/examples/hello_world.rs
          test -s results/hermes/svelte.json
          test -s results/hermes/solid.json
      - name: Compile official GPUI's native example using actual Hermes scenes
        working-directory: .zed-source
        env:
          CARGO_BUILD_JOBS: '3'
        run: cargo build -p gpui --example hello_world
      - name: Open two real GPU windows, screenshot, and verify pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/gpui-linux
          Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp > results/gpui-linux/xvfb.log 2>&1 &
          xpid=$!
          trap 'kill "$xpid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          sleep 3
          for f in svelte solid; do
            export HERMES_BENCH_JSON="$GITHUB_WORKSPACE/results/hermes/$f.json"
            .zed-source/target/debug/examples/hello_world > "results/gpui-linux/$f-runtime.log" 2>&1 &
            pid=$!
            for tick in $(seq 1 35); do
              if grep -q GPUI_WINDOW_CREATED "results/gpui-linux/$f-runtime.log"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat "results/gpui-linux/$f-runtime.log"; exit 1; fi
              sleep 1
            done
            grep -q "GPUI_IMPORTED_HERMES_SCENE_OK:$f" "results/gpui-linux/$f-runtime.log"
            grep -q GPUI_WINDOW_CREATED "results/gpui-linux/$f-runtime.log"
            for frame in $(seq 1 22); do
              if grep -q "GPUI_REPLAY_BENCH_PASS:$f" "results/gpui-linux/$f-runtime.log"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            python3 tools/extract-gpui-replay.py \
              --log "results/gpui-linux/$f-runtime.log" --framework "$f" \
              --platform linux --out "results/gpui-linux/$f-metrics.json"
            import -window root "results/gpui-linux/$f.png"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            python3 platforms/native/verify-image.py "results/gpui-linux/$f.png"
          done
          echo GPUI_REAL_LINUX_WINDOW_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-linux-svelte-solid-real-windows
          path: results/gpui-linux/
          retention-days: 30
      - name: Stage runnable Linux replay debug package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          pkg=results/gpui-linux-package-debug
          rm -rf "$pkg"
          mkdir -p "$pkg"
          cp .zed-source/target/debug/examples/hello_world "$pkg/hello_world"
          chmod +x "$pkg/hello_world"
          cp results/hermes/svelte.json results/hermes/solid.json "$pkg/"
          cat > "$pkg/run.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          FRAMEWORK="${1:-svelte}"
          export HERMES_BENCH_JSON="$DIR/${FRAMEWORK}.json"
          exec "$DIR/hello_world"
          SH
          chmod +x "$pkg/run.sh"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpui-linux-replay-package-debug
          path: results/gpui-linux-package-debug/
          retention-days: 14

  gpui-linux-live-hermes-window:
    if: ${{ inputs.live_hermes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: v1.29.3
          path: .zed-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: live-svelte-solid-hermes-jsi-rust-scene
          run-id: 45295492997
          github-token: ${{ github.token }}
          path: results/live-hermes
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.97.0'
          cache: false
      - name: Install GPUI, Hermes, X11, Mesa, Xvfb and screenshot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake ninja-build libicu-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev libasound2-dev \
            libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri \
            xvfb xauth xdotool imagemagick python3-pil
      - name: Install live Hermes GPUI view and validate HBC artifacts
        run: |
          set -euo pipefail
          cp platforms/native/bench_view.rs .zed-source/crates/gpui/examples/hello_world.rs
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('.zed-source/crates/gpui/Cargo.toml')
          content = manifest.read_text()
          dependency = 'gpui-hermes-live-spike = { path = "../../../crates/hermes-gpui-spike" }\n'
          marker = '[dev-dependencies]\n'
          if dependency not in content:
              if marker not in content:
                  raise SystemExit('GPUI Cargo.toml has no dev-dependencies section')
              content = content.replace(marker, marker + dependency, 1)
              manifest.write_text(content)
          PY
          hbc_dir=results/live-hermes/crates/hermes-gpui-spike/target
          test -s "$hbc_dir/bootstrap.hbc"
          test -s "$hbc_dir/click.hbc"
          test -s "$hbc_dir/svelte.hbc"
          test -s "$hbc_dir/solid.hbc"
      - name: Compile official GPUI app with embedded Hermes and JSI bridge (debug + release)
        working-directory: .zed-source
        env:
          CARGO_BUILD_JOBS: '3'
        run: |
          cargo build -p gpui --example hello_world
          cargo build -p gpui --example hello_world --release
      - name: Open Linux GPUI windows, execute live framework HBC, capture and verify pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/linux-live-hermes
          Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp > results/linux-live-hermes/xvfb.log 2>&1 &
          xpid=$!
          trap 'kill "$xpid" 2>/dev/null || true' EXIT
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          sleep 3
          exe="$GITHUB_WORKSPACE/.zed-source/target/debug/examples/hello_world"
          hbc_dir="$GITHUB_WORKSPACE/results/live-hermes/crates/hermes-gpui-spike/target"
          test -x "$exe"
          for f in svelte solid; do
            export HERMES_FRAMEWORK="$f"
            export HERMES_BOOTSTRAP_HBC="$hbc_dir/bootstrap.hbc"
            export HERMES_CLICK_HBC="$hbc_dir/click.hbc"
            export HERMES_FRAMEWORK_HBC="$hbc_dir/$f.hbc"
            "$exe" > "results/linux-live-hermes/$f-runtime.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true; kill "$xpid" 2>/dev/null || true' EXIT
            ready=false
            for tick in $(seq 1 45); do
              if grep -q GPUI_WINDOW_CREATED "results/linux-live-hermes/$f-runtime.log"; then ready=true; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "results/linux-live-hermes/$f-runtime.log"
            [[ "$ready" == true ]] || { echo "Linux GPUI failed to open live Hermes window for $f"; exit 1; }
            grep -q "GPUI_LIVE_HERMES_VM_READY:$f" "results/linux-live-hermes/$f-runtime.log"
            for frame in $(seq 1 35); do
              if grep -q "GPUI_REPLAY_BENCH_PASS:$f" "results/linux-live-hermes/$f-runtime.log"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            python3 tools/extract-gpui-replay.py --log "results/linux-live-hermes/$f-runtime.log" --framework "$f" --platform linux --out "results/linux-live-hermes/$f-metrics.json"
            import -window root "results/linux-live-hermes/$f.png"
            python3 platforms/native/verify-image.py "results/linux-live-hermes/$f.png"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            trap 'kill "$xpid" 2>/dev/null || true' EXIT
          done
          echo GPUI_LINUX_LIVE_HERMES_TWO_WINDOWS_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-linux-live-hermes-svelte-solid-evidence
          path: results/linux-live-hermes/
          retention-days: 14
      - name: Stage runnable Linux live-Hermes debug package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          pkg=results/linux-live-hermes-package-debug
          hbc_dir=results/live-hermes/crates/hermes-gpui-spike/target
          rm -rf "$pkg"
          mkdir -p "$pkg/hbc"
          cp .zed-source/target/debug/examples/hello_world "$pkg/hello_world"
          chmod +x "$pkg/hello_world"
          cp "$hbc_dir/bootstrap.hbc" "$hbc_dir/click.hbc" "$hbc_dir/svelte.hbc" "$hbc_dir/solid.hbc" "$pkg/hbc/"
          cat > "$pkg/run.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          FRAMEWORK="${1:-svelte}"
          export HERMES_FRAMEWORK="$FRAMEWORK"
          export HERMES_BOOTSTRAP_HBC="$DIR/hbc/bootstrap.hbc"
          export HERMES_CLICK_HBC="$DIR/hbc/click.hbc"
          export HERMES_FRAMEWORK_HBC="$DIR/hbc/${FRAMEWORK}.hbc"
          exec "$DIR/hello_world"
          SH
          chmod +x "$pkg/run.sh"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpui-linux-live-hermes-package-debug
          path: results/linux-live-hermes-package-debug/
          retention-days: 14
      - name: Stage runnable Linux live-Hermes release package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          pkg=results/linux-live-hermes-package-release
          hbc_dir=results/live-hermes/crates/hermes-gpui-spike/target
          rm -rf "$pkg"
          mkdir -p "$pkg/hbc"
          cp .zed-source/target/release/examples/hello_world "$pkg/hello_world"
          chmod +x "$pkg/hello_world"
          cp "$hbc_dir/bootstrap.hbc" "$hbc_dir/click.hbc" "$hbc_dir/svelte.hbc" "$hbc_dir/solid.hbc" "$pkg/hbc/"
          cat > "$pkg/run.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          FRAMEWORK="${1:-svelte}"
          export HERMES_FRAMEWORK="$FRAMEWORK"
          export HERMES_BOOTSTRAP_HBC="$DIR/hbc/bootstrap.hbc"
          export HERMES_CLICK_HBC="$DIR/hbc/click.hbc"
          export HERMES_FRAMEWORK_HBC="$DIR/hbc/${FRAMEWORK}.hbc"
          exec "$DIR/hello_world"
          SH
          chmod +x "$pkg/run.sh"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpui-linux-live-hermes-package-release
          path: results/linux-live-hermes-package-release/
          retention-days: 14
