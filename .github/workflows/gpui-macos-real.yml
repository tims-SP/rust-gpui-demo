name: Real macOS GPUI live Hermes Svelte Solid windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpui-macos-real.yml'
      - 'platforms/native/verify-macos-image.py'
permissions:
  contents: read
  actions: read
jobs:
  macos-live-hermes-window:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: v1.29.3
          path: .zed-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: live-svelte-solid-hermes-jsi-rust-scene
          run-id: 45295492997
          github-token: ${{ github.token }}
          path: results/live-hermes
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.97.0'
          cache: false
      - name: Install live Hermes GPUI view and validate HBC artifacts
        run: |
          set -euo pipefail
          cp platforms/native/bench_view.rs .zed-source/crates/gpui/examples/hello_world.rs
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('.zed-source/crates/gpui/Cargo.toml')
          content = manifest.read_text()
          dependency = 'gpui-hermes-live-spike = { path = "../../../crates/hermes-gpui-spike" }\n'
          marker = '[dev-dependencies]\n'
          if dependency not in content:
              if marker not in content:
                  raise SystemExit('GPUI Cargo.toml has no dev-dependencies section')
              content = content.replace(marker, marker + dependency, 1)
              manifest.write_text(content)
          PY
          hbc_dir=results/live-hermes/crates/hermes-gpui-spike/target
          test -s "$hbc_dir/bootstrap.hbc"
          test -s "$hbc_dir/click.hbc"
          test -s "$hbc_dir/svelte.hbc"
          test -s "$hbc_dir/solid.hbc"
          realpath .zed-source/crates/gpui/../../../crates/hermes-gpui-spike
          uname -m
          xcodebuild -version
      - name: Compile official GPUI app with embedded Hermes and JSI bridge
        working-directory: .zed-source
        env:
          CARGO_BUILD_JOBS: '3'
        run: cargo build -p gpui --example hello_world
      - name: Install PNG pixel inspection
        run: python3 -m pip install --user --break-system-packages --quiet Pillow
      - name: Run real framework HBC in GPUI windows and verify live JSI render callbacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/macos-gpui
          exe="$GITHUB_WORKSPACE/.zed-source/target/debug/examples/hello_world"
          hbc_dir="$GITHUB_WORKSPACE/results/live-hermes/crates/hermes-gpui-spike/target"
          test -x "$exe"
          for f in svelte solid; do
            export HERMES_FRAMEWORK="$f"
            export HERMES_BOOTSTRAP_HBC="$hbc_dir/bootstrap.hbc"
            export HERMES_CLICK_HBC="$hbc_dir/click.hbc"
            export HERMES_FRAMEWORK_HBC="$hbc_dir/$f.hbc"
            "$exe" > "results/macos-gpui/$f-runtime.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            ready=false
            for i in $(seq 1 45); do
              if grep -q GPUI_WINDOW_CREATED "results/macos-gpui/$f-runtime.log"; then ready=true; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            cat "results/macos-gpui/$f-runtime.log"
            [[ "$ready" == true ]] || { echo "GPUI macOS failed to open live Hermes window for $f"; exit 1; }
            grep -q "GPUI_LIVE_HERMES_VM_READY:$f" "results/macos-gpui/$f-runtime.log"
            for frame in $(seq 1 35); do
              if grep -q "GPUI_REPLAY_BENCH_PASS:$f" "results/macos-gpui/$f-runtime.log"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            python3 tools/extract-gpui-replay.py \\
              --log "results/macos-gpui/$f-runtime.log" --framework "$f" \\
              --platform macos --out "results/macos-gpui/$f-metrics.json"
            screencapture -x "results/macos-gpui/$f.png"
            python3 platforms/native/verify-macos-image.py "results/macos-gpui/$f.png"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            trap - EXIT
          done
          echo GPUI_MACOS_LIVE_HERMES_TWO_WINDOWS_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-macos-live-hermes-svelte-solid-evidence
          path: results/macos-gpui/
          retention-days: 14
