name: PrimJS serialized bytecode and Escargot persistent cache benchmarks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/embedded-bytecode.yml'
      - 'bench/embedded/**'
      - 'bench/static-hermes/kernels.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  embedded:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        kind: [primjs, escargot]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Install Linux engine compilation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build build-essential python3 libicu-dev pkg-config
          bun --version
      - if: matrix.kind == 'primjs'
        uses: actions/checkout@v4
        with:
          repository: lynx-family/primjs
          ref: c6d670ca2250bf3ee967c7b9f28310b4a4b75e5f
          path: .primjs-src
          submodules: recursive
          persist-credentials: false
      - if: matrix.kind == 'escargot'
        uses: actions/checkout@v4
        with:
          repository: Samsung/escargot
          ref: fb66b79dcb45bea038a18c69b5e6e9b13bc2922e
          path: .escargot-src
          submodules: recursive
          persist-credentials: false
      - name: Compile, independently load, verify checksums and measure RSS
        run: bash bench/embedded/run-linux.sh "${{ matrix.kind }}"
      - name: Archive bytecode, cache proof, per-process JSON, RSS and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-js-${{ matrix.kind }}
          path: |
            bench/static-hermes/kernels.js
            bench/embedded/
            results/embedded/
          retention-days: 30
