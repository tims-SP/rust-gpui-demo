name: P0 Hermes HBC + Svelte/Solid custom renderers
on:
  push:
    branches: [main, experiments/strict-mutation-protocol]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: cargo test -p ui-mutation
      - name: Archive JS bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-renderer-node
          path: dist/
          retention-days: 14
  hermes-hbc:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meta/hermes
          ref: d412d3bd851278712c20cca25d094e32641a0465
          path: .hermes-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build original Hermes VM and matching compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libreadline-dev
          cmake -S .hermes-source -B .hermes-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DHERMES_ENABLE_TEST_SUITE=OFF -DHERMES_ENABLE_NAPI=OFF
          cmake --build .hermes-host --target hermes hermesc --parallel 2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Real Hermes HBC execution, events and mutation evidence
        run: bash scripts/check-hbc.sh
      - name: Archive Hermes bytecode and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-hbc-parity
          path: results/hermes/
          retention-days: 30
