name: GPUI Windows macOS iOS Android build feasibility
on:
  push:
    branches: [main, feature/gpui-frame-bench]
    paths: ['.github/workflows/gpui-platform-probes.yml']
  workflow_dispatch:
    inputs:
      live_mobile_hermes:
        description: "Run real Hermes HBC/JSI in GPUI Mobile iOS Simulator and/or Android ARM64 emulator"
        type: boolean
        required: false
        default: false
      live_mobile_target:
        description: "Which mobile target to execute when live_mobile_hermes is enabled"
        type: choice
        options:
          - both
          - ios
          - android
        required: false
        default: both
      android_apk_artifact_run_id:
        description: "Reuse ARM64 live-Hermes APKs from a prior successful workflow run instead of rebuilding"
        type: string
        required: false
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  desktop-gpui-compile:
    if: ${{ !inputs.live_mobile_hermes && github.event_name != 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
          - os: macos-15
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: v1.29.3
          path: .zed-source
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Insert real Hermes scene GPUI view into upstream example
        shell: bash
        run: cp platforms/native/bench_view.rs .zed-source/crates/gpui/examples/hello_world.rs
      - name: Compile desktop GPUI example
        shell: bash
        working-directory: .zed-source
        env:
          CARGO_BUILD_JOBS: '3'
        run: cargo build -p gpui --example hello_world
      - name: Report compile-only, not run/render
        shell: bash
        run: echo "GPUI_DESKTOP_COMPILE_PASS:${{ matrix.label }}"
  ios-gpui-compile:
    if: ${{ !inputs.live_mobile_hermes && github.event_name != 'push' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: v1.29.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios-sim
          cache: false
      - name: Compile upstream GPUI iOS platform backend for Simulator
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          cargo check -p gpui_ios --target aarch64-apple-ios-sim
          echo GPUI_IOS_BACKEND_COMPILE_PASS
  android-gpui-mobile-compile:
    if: ${{ !inputs.live_mobile_hermes && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: itsbalamurali/gpui-mobile
          path: .gpui-mobile
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false
      - name: Cross-compile existing Android GPUI Mobile example
        shell: bash
        run: |
          set -eo pipefail
          export ANDROID_NDK_HOME="$(find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang
          cd .gpui-mobile/example
          cargo check --target aarch64-linux-android
          echo GPUI_ANDROID_BACKEND_COMPILE_PASS


  android-gpui-mobile-apk:
    if: ${{ !inputs.live_mobile_hermes && (github.event_name != 'push' || github.ref != 'refs/heads/feature/gpui-frame-bench' || !contains(github.event.head_commit.message, '[android]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: itsbalamurali/gpui-mobile
          ref: 5fd54f4554263ae06753e90472c7f2e2ff5d7495
          path: .gpui-mobile
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cross-compile ARM64 native GPUI library
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -d "$ANDROID_NDK_HOME"
          cargo install cargo-ndk --locked
          cd .gpui-mobile/example
          cargo ndk -t arm64-v8a -P 31 -o android/gradle/app/src/main/jniLibs build --lib
          test -s android/gradle/app/src/main/jniLibs/arm64-v8a/libgpui_mobile_example.so
          echo GPUI_ANDROID_ARM64_NATIVE_LIBRARY_PASS
      - name: Package real Android APK with Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd .gpui-mobile/example/android/gradle
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import sys, zipfile
          path=sys.argv[1]
          with zipfile.ZipFile(path) as z:
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'lib/arm64-v8a/libgpui_mobile_example.so' in z.namelist(), 'Native GPUI library missing'
          print('GPUI_ANDROID_APK_BUILD_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-mobile-android-arm64-apk
          path: .gpui-mobile/example/android/gradle/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios-live-hermes-window:
    if: ${{ (inputs.live_mobile_hermes && inputs.live_mobile_target != 'android') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/gpui-frame-bench' && contains(github.event.head_commit.message, '[ios]')) }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: itsbalamurali/gpui-mobile
          ref: 5fd54f4554263ae06753e90472c7f2e2ff5d7495
          path: .gpui-mobile
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: live-svelte-solid-hermes-jsi-rust-scene
          run-id: 45295492997
          github-token: ${{ github.token }}
          path: results/live-hermes
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios-sim
          cache: false
      - name: Prepare pinned GPUI Mobile example for live Hermes
        shell: bash
        run: |
          set -euo pipefail
          python3 platforms/mobile/prepare_live_hermes.py --example .gpui-mobile/example --repo "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          project = Path('.gpui-mobile/example/ios/project.yml')
          text = project.read_text()
          old = '          cargo build --lib --target "${RUST_TARGET}" ${CARGO_FLAGS}'
          cargo = 'cargo build --lib --features live-hermes --target "${RUST_TARGET}" ${CARGO_FLAGS}'
          lines = [
              'export CARGO_TARGET_DIR="${RUST_PROJECT_DIR}/target"',
              cargo,
              'if [ "${CONFIGURATION}" = "Release" ]; then CARGO_PROFILE_DIR=release; else CARGO_PROFILE_DIR=debug; fi',
              'EXPECTED_STATIC_LIB="${CARGO_TARGET_DIR}/${RUST_TARGET}/${CARGO_PROFILE_DIR}/libgpui_mobile_example.a"',
              'if [ ! -s "${EXPECTED_STATIC_LIB}" ]; then',
              '  FOUND_STATIC_LIB="$(find "${CARGO_TARGET_DIR}" -type f -name libgpui_mobile_example.a -print -quit)"',
              '  if [ -n "${FOUND_STATIC_LIB}" ]; then',
              '    mkdir -p "$(dirname "${EXPECTED_STATIC_LIB}")"',
              '    cp "${FOUND_STATIC_LIB}" "${EXPECTED_STATIC_LIB}"',
              '  fi',
              'fi',
              'if [ ! -s "${EXPECTED_STATIC_LIB}" ]; then',
              '  echo "ERROR: Cargo completed but iOS static library is missing: ${EXPECTED_STATIC_LIB}"',
              '  echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"',
              '  find "${CARGO_TARGET_DIR}" -type f -name "*.a" -print | head -100 || true',
              '  exit 1',
              'fi',
              'echo "IOS_RUST_STATIC_LIBRARY_PASS:${EXPECTED_STATIC_LIB}"',
              'ls -lh "${EXPECTED_STATIC_LIB}"',
          ]
          new = "\n".join("          " + line for line in lines)
          if new not in text:
              if old not in text:
                  raise SystemExit('Could not locate the GPUI Mobile iOS Rust build command')
              text = text.replace(old, new, 1)
          output_marker = '      - name: "Build Rust Static Library"\n        script: |\n'
          output_phase = ('      - name: "Build Rust Static Library"\n'
                          '        outputFiles:\n'
                          '          - "$(EXAMPLE_STATIC_LIB)"\n'
                          '        script: |\n')
          if '        outputFiles:\n          - "$(EXAMPLE_STATIC_LIB)"\n' not in text:
              if output_marker not in text:
                  raise SystemExit('Could not locate XcodeGen Build Rust Static Library phase')
              text = text.replace(output_marker, output_phase, 1)
          project.write_text(text)
          PY
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Install screenshot validation dependency
        shell: bash
        run: |
          set -euo pipefail
          image_venv="$RUNNER_TEMP/gpui-image-venv"
          python3 -m venv "$image_venv"
          "$image_venv/bin/python" -m pip install --disable-pip-version-check Pillow
          echo "GPUI_IMAGE_PYTHON=$image_venv/bin/python" >> "$GITHUB_ENV"
          "$image_venv/bin/python" -c 'import PIL; print(f"Pillow {PIL.__version__}")'
      - name: Build and run live Hermes on iOS Simulator for both frameworks
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/results/ios-live-hermes"
          hbc="$GITHUB_WORKSPACE/results/live-hermes/crates/hermes-gpui-spike/target"
          example="$GITHUB_WORKSPACE/.gpui-mobile/example"
          mkdir -p "$out"
          xcrun simctl list devices available -j > "$out/devices.json"
          udid="$(python3 -c 'import json; d=json.load(open("'"$out/devices.json"'")); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))' )"
          test -n "$udid"
          xcrun simctl boot "$udid" 2>/dev/null || true
          python3 - "$udid" <<'PYBOOT'
          import subprocess, sys
          udid = sys.argv[1]
          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"],
                             check=True, timeout=300)
          except subprocess.TimeoutExpired:
              subprocess.run(["xcrun", "simctl", "list", "devices", "booted"], check=False)
              raise SystemExit("iOS Simulator bootstatus timed out after 300 seconds")
          PYBOOT
          cd "$example/ios"
          xcodegen generate
          for framework in svelte solid; do
            export GPUI_LIVE_HERMES_FRAMEWORK="$framework"
            export GPUI_LIVE_HERMES_BOOTSTRAP_HBC="$hbc/bootstrap.hbc"
            export GPUI_LIVE_HERMES_CLICK_HBC="$hbc/click.hbc"
            export GPUI_LIVE_HERMES_FRAMEWORK_HBC="$hbc/$framework.hbc"
            echo "Reusing Cargo target cache: $example/target/aarch64-apple-ios-sim"
            derived="$GITHUB_WORKSPACE/.derived-ios-$framework"
            rm -rf "$derived"
            set -o pipefail
            xcodebuild -project GpuiExample.xcodeproj -scheme GpuiExample \
              -configuration Debug -destination "id=$udid" \
              -derivedDataPath "$derived" build 2>&1 | tee "$out/$framework-build.log" | tail -100
            app="$derived/Build/Products/Debug-iphonesimulator/GpuiExample.app"
            test -d "$app"
            xcrun simctl terminate "$udid" dev.gpui.mobile.example >/dev/null 2>&1 || true
            xcrun simctl install "$udid" "$app"
            xcrun simctl spawn "$udid" log stream --level info --style compact \
              --predicate 'process == "GpuiExample"' > "$out/$framework-runtime.log" 2>&1 &
            logpid=$!
            xcrun simctl launch "$udid" dev.gpui.mobile.example
            passed=false
            for tick in $(seq 1 75); do
              if grep -q "GPUI_LIVE_HERMES_PASS:$framework" "$out/$framework-runtime.log"; then passed=true; break; fi
              if ! kill -0 "$logpid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [[ "$passed" != true ]]; then
              xcrun simctl spawn "$udid" log show --last 3m --style compact \
                --predicate 'process == "GpuiExample"' >> "$out/$framework-runtime.log" 2>&1 || true
              cat "$out/$framework-runtime.log"
              kill "$logpid" 2>/dev/null || true
              exit 1
            fi
            python3 "$GITHUB_WORKSPACE/tools/extract-gpui-replay.py" \
              --log "$out/$framework-runtime.log" --framework "$framework" \
              --platform ios --out "$out/$framework-metrics.json"
            xcrun simctl io "$udid" screenshot "$out/$framework.png"
            "$GPUI_IMAGE_PYTHON" "$GITHUB_WORKSPACE/tools/verify-mobile-live-image.py" "$out/$framework.png"
            kill "$logpid" 2>/dev/null || true
            xcrun simctl terminate "$udid" dev.gpui.mobile.example >/dev/null 2>&1 || true
          done
          echo GPUI_IOS_LIVE_HERMES_TWO_FRAMEWORKS_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-ios-live-hermes-svelte-solid-evidence
          path: results/ios-live-hermes/
          retention-days: 14

  android-live-hermes-arm64-build:
    name: android-live-hermes-arm64-build
    if: ${{ (inputs.live_mobile_hermes && inputs.live_mobile_target != 'ios' && inputs.android_apk_artifact_run_id == '') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/gpui-frame-bench' && contains(github.event.head_commit.message, '[android]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: itsbalamurali/gpui-mobile
          ref: 5fd54f4554263ae06753e90472c7f2e2ff5d7495
          path: .gpui-mobile
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: live-svelte-solid-hermes-jsi-rust-scene
          run-id: 45295492997
          github-token: ${{ github.token }}
          path: results/live-hermes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          cache: false
      - name: Install ARM64 Android build toolchain
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Prepare pinned GPUI Mobile example and Gradle mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 platforms/mobile/prepare_live_hermes.py --example .gpui-mobile/example --repo "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          for relative in ("android/gradle/settings.gradle.kts", "android/gradle/build.gradle.kts"):
              path = Path(".gpui-mobile/example") / relative
              content = path.read_text()
              content = re.sub(r"(?m)^(\s*)mavenCentral\(\)$",
                               lambda match: match.group(1) + mirror + "\n" + match.group(1) + "mavenCentral()",
                               content)
              path.write_text(content)
          PY
          cargo install cargo-ndk --locked
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$ANDROID_NDK_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
      - name: Build Svelte and Solid ARM64 live-Hermes APKs
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/results/android-live-hermes-build"
          hbc="$GITHUB_WORKSPACE/results/live-hermes/crates/hermes-gpui-spike/target"
          example="$GITHUB_WORKSPACE/.gpui-mobile/example"
          mkdir -p "$out"
          cd "$example"
          for framework in svelte solid; do
            export GPUI_LIVE_HERMES_FRAMEWORK="$framework"
            export GPUI_LIVE_HERMES_BOOTSTRAP_HBC="$hbc/bootstrap.hbc"
            export GPUI_LIVE_HERMES_CLICK_HBC="$hbc/click.hbc"
            export GPUI_LIVE_HERMES_FRAMEWORK_HBC="$hbc/$framework.hbc"
            rm -rf android/gradle/app/src/main/jniLibs/arm64-v8a
            cargo ndk -t arm64-v8a -P 31 -o android/gradle/app/src/main/jniLibs \
              build --lib --features live-hermes
            test -s android/gradle/app/src/main/jniLibs/arm64-v8a/libgpui_mobile_example.so
            (
              cd android/gradle
              chmod +x ./gradlew
              ./gradlew :app:assembleDebug --no-daemon --stacktrace
            )
            apk="android/gradle/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$apk"
            python3 - "$apk" <<'PYAPK'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              assert "lib/arm64-v8a/libgpui_mobile_example.so" in apk.namelist(), "ARM64 GPUI library missing"
          print("GPUI_ANDROID_ARM64_APK_PASS")
          PYAPK
            cp "$apk" "$out/$framework.apk"
          done
          echo GPUI_ANDROID_ARM64_LIVE_HERMES_APK_BUILD_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-android-arm64-live-hermes-apks
          path: results/android-live-hermes-build/
          retention-days: 14

  android-live-hermes-window:
    name: android-live-hermes-arm64-guest-tcg-window
    needs: android-live-hermes-arm64-build
    if: ${{ !cancelled() && (needs.android-live-hermes-arm64-build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.android_apk_artifact_run_id != '')) && ((inputs.live_mobile_hermes && inputs.live_mobile_target != 'ios') || (github.event_name == 'push' && github.ref == 'refs/heads/feature/gpui-frame-bench' && contains(github.event.head_commit.message, '[android]')))}}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpui-android-arm64-live-hermes-apks
          run-id: ${{ inputs.android_apk_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: results/android-live-hermes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install screenshot validation dependency
        shell: bash
        run: |
          set -euo pipefail
          image_venv="$RUNNER_TEMP/gpui-image-venv"
          python3 -m venv "$image_venv"
          "$image_venv/bin/python" -m pip install --disable-pip-version-check Pillow
          echo "GPUI_IMAGE_PYTHON=$image_venv/bin/python" >> "$GITHUB_ENV"
          "$image_venv/bin/python" -c 'import PIL; print(f"Pillow {PIL.__version__}")'
      - name: Install official x86_64 Android Emulator and ARM64 guest image
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = amd64
          test -n "$ANDROID_HOME"
          sudo apt-get update
          sudo apt-get install -y libpulse0 libpcre2-16-0
          mkdir -p "$ANDROID_HOME" "$GITHUB_WORKSPACE/results/android-live-hermes"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v sdkmanager
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          set +o pipefail
          yes | sdkmanager --licenses
          license_status=$?
          set -o pipefail
          test "$license_status" -eq 0
          # Official x86_64 emulator host binary, ARM64 Android guest ABI.
          # Host and guest differ, so execution is software TCG, not KVM.
          sdkmanager --install \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;arm64-v8a"
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          test -x "$emulator_bin"
          emulator_arch="$(file -b "$emulator_bin")"
          echo "ANDROID_EMULATOR_HOST_BINARY=$emulator_arch"
          case "$emulator_arch" in
            *x86-64*|*x86_64*) ;;
            *) echo "Expected an x86_64 host emulator binary"; exit 1 ;;
          esac
          "$emulator_bin" -version 2>&1 | tee "$GITHUB_WORKSPACE/results/android-live-hermes/emulator-version.txt"
          qemu_arm_bin="$(find "$ANDROID_HOME/emulator" -type f -name 'qemu-system-aarch64*' -print -quit)"
          test -n "$qemu_arm_bin"
          qemu_arch="$(file -b "$qemu_arm_bin")"
          echo "ANDROID_QEMU_ARM64_GUEST_BINARY=$qemu_arm_bin ($qemu_arch)"
          case "$qemu_arch" in
            *x86-64*|*x86_64*) ;;
            *) echo "Expected an x86_64 QEMU binary for the ARM64 guest"; exit 1 ;;
          esac
          printf '%s\n' "$qemu_arm_bin ($qemu_arch)" > "$GITHUB_WORKSPACE/results/android-live-hermes/qemu-binary.txt"
          "$ANDROID_HOME/platform-tools/adb" version
          export ANDROID_USER_HOME="$RUNNER_TEMP/gpui-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_GUEST_SYSTEM_IMAGE=android-35;google_apis;arm64-v8a"
          echo "ANDROID_EMULATOR_EXECUTION_MODE=QEMU_TCG_X86_64_HOST_ARM64_GUEST"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH" >> "$GITHUB_ENV"

      - name: Create and boot ARM64 Android guest under x86_64 TCG
        timeout-minutes: 65
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          test -n "$ANDROID_USER_HOME"
          test -n "$ANDROID_AVD_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --force --name gpui-live-arm64 \
            --package "system-images;android-35;google_apis;arm64-v8a"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          avdmanager list avd
          test -s "$ANDROID_AVD_HOME/gpui-live-arm64.ini"
          test -d "$ANDROID_AVD_HOME/gpui-live-arm64.avd"
          emulator_bin="$ANDROID_HOME/emulator/emulator"
          export ANDROID_I_WANT_MY_TCG=yes
          "$emulator_bin" -avd gpui-live-arm64 -no-window -no-audio -no-boot-anim \
            -accel off -gpu swiftshader_indirect -cores 1 \
            -no-snapshot -no-snapshot-load -no-snapshot-save -no-metrics \
            -qemu -machine gic-version=3 -cpu max \
            > results-android-emulator.log 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > /tmp/gpui-live-emulator.pid
          echo "ANDROID_TCG_CONFIG=host-x86_64 guest-arm64-v8a cpu=max gic=v3"

          print_startup_diagnostics() {
            echo "--- emulator/QEMU process tree ---"
            ps -eo pid,ppid,stat,etime,pcpu,pmem,args | grep -E '[e]mulator|[q]emu-system-aarch64' || true
            echo "--- ADB devices ---"
            timeout 10s adb devices -l || true
            echo "--- Android boot properties ---"
            timeout 10s adb shell getprop sys.boot_completed || true
            echo "--- Emulator/QEMU log ---"
            cat results-android-emulator.log || true
          }

          find_qemu_pid() {
            pgrep -f '[q]emu-system-aarch64' | head -n 1 || true
          }

          qemu_pid=""
          for tick in $(seq 1 45); do
            qemu_pid="$(find_qemu_pid)"
            if [[ -n "$qemu_pid" ]]; then break; fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Android Emulator exited before the ARM64 QEMU backend started"
              print_startup_diagnostics
              exit 1
            fi
            sleep 1
          done

          if [[ -z "$qemu_pid" ]]; then
            echo "ARM64 QEMU backend was not visible within 45 seconds"
            print_startup_diagnostics
            exit 1
          fi
          echo "$qemu_pid" > /tmp/gpui-live-qemu.pid
          echo "ANDROID_QEMU_BACKEND_PID=$qemu_pid"

          assert_qemu_running() {
            local state
            state="$(ps -o stat= -p "$qemu_pid" 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ -z "$state" || "$state" == Z* ]]; then
              echo "ARM64 QEMU backend exited before Android became ready (pid=$qemu_pid state=$state)"
              print_startup_diagnostics
              exit 1
            fi
          }

          adb_deadline=$((SECONDS + 20 * 60))
          device_ready=false
          while (( SECONDS < adb_deadline )); do
            if timeout 5s adb get-state 2>/dev/null | grep -qx device; then
              device_ready=true
              break
            fi
            assert_qemu_running
            sleep 2
          done
          if [[ "$device_ready" != true ]]; then
            echo "Timed out after 20 minutes waiting for ARM64 Android ADB device (TCG)"
            print_startup_diagnostics
            exit 1
          fi

          boot_deadline=$((SECONDS + 40 * 60))
          booted=false
          while (( SECONDS < boot_deadline )); do
            boot_state="$(timeout 7s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot_state" == "1" ]]; then
              booted=true
              break
            fi
            assert_qemu_running
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            echo "Timed out after 40 minutes waiting for Android sys.boot_completed (TCG)"
            print_startup_diagnostics
            exit 1
          fi

          runtime_abi="$(timeout 10s adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "ANDROID_RUNTIME_ABI=$runtime_abi"
          test "$runtime_abi" = "arm64-v8a"
          mkdir -p "$GITHUB_WORKSPACE/results/android-live-hermes"
          python3 - "$GITHUB_WORKSPACE/results/android-live-hermes/runtime-environment.json" "$runtime_abi" "$qemu_pid" <<'PYENV'
          import json, platform, sys
          out, guest_abi, qemu_pid = sys.argv[1:]
          json.dump({
              "host_arch": platform.machine(),
              "emulator_host_arch": "x86_64",
              "guest_abi": guest_abi,
              "cpu_acceleration": "qemu-tcg-software",
              "gic_version": 3,
              "cpu_model": "max",
              "kvm_available": False,
              "qemu_pid": int(qemu_pid),
              "emulator_distribution": "official Android SDK Linux x86_64",
              "system_image": "android-35;google_apis;arm64-v8a"
          }, open(out, "w"), indent=2)
          print("ANDROID_ARM64_TCG_RUNTIME_ENVIRONMENT_RECORDED")
          PYENV
          adb shell input keyevent 82 || true
      - name: Install and run Svelte and Solid on Android ARM64 emulator
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/results/android-live-hermes"
          mkdir -p "$out"
          export PATH="/usr/bin:$PATH"
          for framework in svelte solid; do
            apk="$GITHUB_WORKSPACE/results/android-live-hermes/$framework.apk"
            test -s "$apk"
            adb uninstall dev.gpui.mobile.example >/dev/null 2>&1 || true
            adb install "$apk"
            adb logcat -c
            adb logcat -v time -s gpui-mobile-example:I > "$out/$framework-runtime.log" 2>&1 &
            logpid=$!
            adb shell am start -n dev.gpui.mobile.example/dev.gpui.mobile.GpuiActivity
            passed=false
            for tick in $(seq 1 90); do
              if grep -q "GPUI_LIVE_HERMES_PASS:$framework" "$out/$framework-runtime.log"; then passed=true; break; fi
              sleep 1
            done
            if [[ "$passed" != true ]]; then
              adb logcat -d -s gpui-mobile-example:I >> "$out/$framework-runtime.log" 2>&1 || true
              cat "$out/$framework-runtime.log"
              kill "$logpid" 2>/dev/null || true
              exit 1
            fi
            python3 "$GITHUB_WORKSPACE/tools/extract-gpui-replay.py" \
              --log "$out/$framework-runtime.log" --framework "$framework" \
              --platform android --out "$out/$framework-metrics.json"
            adb exec-out screencap -p > "$out/$framework.png"
            "$GPUI_IMAGE_PYTHON" "$GITHUB_WORKSPACE/tools/verify-mobile-live-image.py" "$out/$framework.png"
            kill "$logpid" 2>/dev/null || true
            adb shell am force-stop dev.gpui.mobile.example
          done
          echo GPUI_ANDROID_ARM64_TCG_LIVE_HERMES_TWO_FRAMEWORKS_PASS
      - if: always()
        shell: bash
        run: |
          set +e
          mkdir -p results/android-live-hermes
          if [ -s /tmp/gpui-live-emulator.pid ]; then
            emulator_pid="$(cat /tmp/gpui-live-emulator.pid)"
            if command -v timeout >/dev/null 2>&1 && timeout 5s adb get-state >/dev/null 2>&1; then
              timeout 12s adb logcat -d -s gpui-mobile-example:I > results/android-live-hermes/final-logcat.txt 2>&1
            fi
            if [ -s /tmp/gpui-live-qemu.pid ]; then
              qemu_pid="$(cat /tmp/gpui-live-qemu.pid)"
              kill "$qemu_pid" 2>/dev/null
              rm -f /tmp/gpui-live-qemu.pid
            fi
            kill "$emulator_pid" 2>/dev/null
            wait "$emulator_pid" 2>/dev/null
            rm -f /tmp/gpui-live-emulator.pid
          else
            : > results/android-live-hermes/final-logcat.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpui-android-arm64-tcg-live-hermes-svelte-solid-evidence
          path: |
            results/android-live-hermes/
            results-android-emulator.log
          retention-days: 14
