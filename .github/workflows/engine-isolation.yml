name: Isolate JS engine and Svelte development condition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engine-isolation.yml'
      - 'bench/common.ts'
      - 'bench/engine_compare.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      XDG_SESSION_TYPE: x11
      WINIT_UNIX_BACKEND: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Mesa Vulkan and X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-xcb1 libxkbcommon-x11-0 libxkbcommon0 libwayland-client0 \
            libfontconfig1 libvulkan1 fonts-noto-cjk libasound2t64 libssl3
          mkdir -p results
          bun --version
          node --version
      - name: Install dependencies
        run: |
          bun install
          bun pm ls > results/dependencies.txt
      - name: Run every variant in one runner with alternating order
        run: |
          set -euo pipefail
          for trial in 0 1 2 3; do
            export BENCH_TRIAL="$trial"
            if (( trial % 2 == 0 )); then
              cases=(svelte-cli svelte-dev svelte-prod solid)
            else
              cases=(solid svelte-prod svelte-dev svelte-cli)
            fi
            for variant in "${cases[@]}"; do
              export BENCH_CASE="$variant"
              echo "::group::ENGINE $variant trial $trial"
              case "$variant" in
                svelte-cli)
                  xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                    bunx gpuix-svelte --bun bench/svelte.ts 2>&1 | tee "results/$variant-$trial.log"
                  ;;
                svelte-dev)
                  xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                    bun --conditions custom-renderer --conditions development \
                    --preload gpuix-svelte/plugin bench/svelte.ts 2>&1 | tee "results/$variant-$trial.log"
                  ;;
                svelte-prod)
                  xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                    bun --conditions custom-renderer \
                    --preload gpuix-svelte/plugin bench/svelte.ts 2>&1 | tee "results/$variant-$trial.log"
                  ;;
                solid)
                  xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                    bun --preload @gpuix/solid/preload bench/solid.tsx 2>&1 | tee "results/$variant-$trial.log"
                  ;;
              esac
              echo "::endgroup::"
            done
          done
      - name: Verify runtime identity and report performance
        run: |
          python3 bench/engine_compare.py
          cat results/ENGINE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full runtime evidence, raw samples and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-js-engine-isolation
          path: results/
          if-no-files-found: warn
          retention-days: 30
