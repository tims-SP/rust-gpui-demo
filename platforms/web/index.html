<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hermes Wasm Svelte/Solid HBC + interactive JSI bridge QA</title></head>
<body>
  <h1>Hermes WebAssembly: Svelte 5 vs Solid</h1>
  <p id="result-svelte" data-status="pending">PENDING</p>
  <p id="result-solid" data-status="pending">PENDING</p>
  <button id="click-svelte" disabled>Send Svelte event into Hermes</button>
  <p id="interactive-svelte" data-status="pending">PENDING</p>
  <button id="click-solid" disabled>Send Solid event into Hermes</button>
  <p id="interactive-solid" data-status="pending">PENDING</p>
  <pre id="details"></pre>
  <script src="./hermes.js"></script>
  <script>
  (async function(){
    const expected={count:256,start:40,theme:"light",renderedRows:48};
    const details=document.getElementById("details");
    for(const f of ["svelte","solid"]){
      const status=document.getElementById("result-"+f);
      const interactive=document.getElementById("interactive-"+f);
      const button=document.getElementById("click-"+f);
      const out=[],errs=[];
      try{
        const vm=await CreateHermesVM({
          locateFile:n=>"./"+n,
          print:s=>out.push(String(s)),
          printErr:s=>errs.push(String(s))
        });
        for(const [file,target] of [["shim.hbc","/shim.hbc"],[f+".hbc","/app.hbc"]]){
          const response=await fetch("./"+file);
          if(!response.ok)throw Error("HTTP status "+response.status+" for "+file);
          vm.FS.writeFile(target,new Uint8Array(await response.arrayBuffer()));
        }
        const shim=vm.ccall("hermes_run_hbc_file","number",["string"],["/shim.hbc"]);
        if(shim===-6)throw Error("Hermes shim: "+errs.join("\n"));
        const rc=vm.ccall("hermes_run_hbc_file","number",["string"],["/app.hbc"]);
        if(rc===-6)throw Error("Hermes HBC: "+errs.join("\n"));
        const lines=out.filter(x=>x.startsWith("BENCH_RESULT:"));
        if(lines.length!==1||!out.includes("GPUI_SCENE_OK:"+f))
          throw Error("Bytecode output missing, rc="+rc+" stderr="+errs.join("\n"));
        const payload=JSON.parse(lines[0].slice("BENCH_RESULT:".length));
        if(payload.framework!==f||JSON.stringify(payload.final)!==JSON.stringify(expected))
          throw Error("Wrong Hermes scene: "+JSON.stringify(payload.final));
        status.textContent="PASS_HERMES_HBC_"+f.toUpperCase();
        status.dataset.status="pass";
        button.disabled=false;
        const performClick=async function(){
          const before=out.length;
          const result=vm.ccall("hermes_run_hbc_file","number",["string"],["/shim.hbc"]);
          if(result===-6)throw Error("Hermes interactive HBC evaluation: "+errs.join("\n"));
          // Await the Hermes callback's microtask boundary (also works synchronously).
          await Promise.resolve();
          const tail=out.slice(before);
          const marker=tail.find(x=>x.startsWith("HERMES_INTERACTIVE_RESULT:"+f+":1001:"));
          const mutations=tail.filter(x=>x.startsWith("HERMES_MUTATION_BATCH:"))
            .map(x=>JSON.parse(x.slice("HERMES_MUTATION_BATCH:".length)));
          if(!marker||mutations.length!==1||!mutations[0].some(x=>x[0]==="text"))
            throw Error("Hermes interactive event did not yield one text mutation batch: "+tail.slice(-4).join(" | "));
          interactive.textContent="PASS_HERMES_INTERACTIVE_"+f.toUpperCase();
          interactive.dataset.status="pass";
          details.textContent+=f+" interactive="+marker+
            " forwarded_mutations="+mutations[0].length+"\n";
        };
        button.addEventListener("click",()=>performClick().catch(error=>{
          interactive.textContent="FAIL "+String(error);
          interactive.dataset.status="fail";
        }),{once:true});
        // Exercises the actual Chromium DOM event delivery path, NOT a fake
        // invocation inside V8 of the framework component functions.
        button.click();
        details.textContent+=f+" initial_mutations="+payload.mutations+"\n";
      }catch(error){
        status.textContent="FAIL "+String(error.stack||error);
        status.dataset.status="fail";
        interactive.textContent="FAIL "+String(error.stack||error);
        interactive.dataset.status="fail";
        details.textContent+=f+" "+errs.join("\n")+"\n";
      }
    }
  }());
  </script>
</body></html>
