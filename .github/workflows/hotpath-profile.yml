name: Profile GPUIX JS host hotpaths on Linux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotpath-profile.yml'
      - 'bench/hotpath.ts'
      - 'bench/solid.tsx'
      - 'bench/svelte.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      XDG_SESSION_TYPE: x11
      WINIT_UNIX_BACKEND: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      HOTPATH_PROFILE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Mesa Vulkan and X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-xcb1 libxkbcommon-x11-0 libxkbcommon0 libwayland-client0 \
            libfontconfig1 libvulkan1 fonts-noto-cjk libasound2t64 libssl3
          mkdir -p results
      - name: Install dependencies
        run: bun install
      - name: CPU-sample Svelte production and Solid separately
        run: |
          set -euo pipefail
          export BENCH_TRIAL=30
          export BENCH_CASE=hotpath
          for framework in svelte solid; do
            if [ "$framework" = svelte ]; then
              xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                bun --conditions custom-renderer --preload gpuix-svelte/plugin \
                bench/svelte.ts 2>&1 | tee results/svelte-hotpath.log
            else
              xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                bun --preload @gpuix/solid/preload bench/solid.tsx 2>&1 | tee results/solid-hotpath.log
            fi
          done
      - name: Verify eight CPU sample outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for fw in ("svelte", "solid"):
              for scene in ("single", "theme", "reorder", "window"):
                  p = Path(f"results/hotpath-{fw}-{scene}-30.json")
                  assert p.exists(), p
                  data = json.loads(p.read_text())
                  assert data["runtime"]["bun"] == "1.4.5"
                  assert data["elapsedMs"] > 0
                  assert data["cpu"], f"Empty CPU profiler for {p}"
                  print(f"{fw}/{scene}: {data['elapsedMs']}ms, CPU keys {list(data['cpu'])}")
          PY
      - name: Upload raw CPU profiles, screenshots and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-linux-hotpath-profiles
          path: results/
          retention-days: 30
