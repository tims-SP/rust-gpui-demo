name: Ibex2 Rust native and Hermes VM WebAssembly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ibex-hermes-web-wasm.yml'
      - 'bench/hermes-ibex-wasm/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ibex2:
    if: ${{ !contains(github.event.head_commit.message, '[web-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: expo/ibex
          ref: 24cd0ae8cdd20106bed04cd3a4a2378d1dd81995
          path: .ibex-source
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.97.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native Rust Hermes dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build python3 libicu-dev pkg-config
      - name: Compile actual Ibex 2 Rust runtime and execute precompiled JS
        env:
          RUSTFLAGS: '-A mismatched-lifetime-syntaxes'
        run: bash bench/hermes-ibex-wasm/native-smoke.sh
      - name: Archive native HBC manifest and process output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibex2-rust-hermes-native
          path: results/ibex-hermes-wasm/native/
          retention-days: 30

  web-hermes-vm:
    if: ${{ !contains(github.event.head_commit.message, '[native-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: meta/hermes
          ref: d412d3bd851278712c20cca25d094e32641a0465
          path: .hermes-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.15'
      - name: Install native Hermes host build requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build python3 libreadline-dev file curl
          node --version
          emcc --version
      - name: Build Hermes VM into Wasm and execute HBC in Node and Chromium
        run: bash bench/hermes-ibex-wasm/web-smoke.sh
      - name: Archive browser Wasm, HBC, logs, and DOM execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-vm-webassembly-browser
          path: results/ibex-hermes-wasm/
          retention-days: 30
