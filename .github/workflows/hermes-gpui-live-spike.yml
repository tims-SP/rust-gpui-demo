name: In-process Hermes HBC and JSI host probe
on:
  workflow_dispatch:
  push:
    branches: [feature/gpui-frame-bench]
    paths:
      - 'crates/hermes-gpui-spike/**'
      - '.github/workflows/hermes-gpui-live-spike.yml'
permissions:
  contents: read
jobs:
  in-process-hermes-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.97.0'
          cache: false
      - name: Install native Hermes build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y clang cmake ninja-build libicu-dev pkg-config
      - name: Resolve a reproducible dependency lock
        run: cargo generate-lockfile --manifest-path crates/hermes-gpui-spike/Cargo.toml
      - name: Execute HBC in the embedded Hermes runtime and call a stock JSI host function
        run: |
          mkdir -p results/gpui-hermes-spike
          cargo run --locked --manifest-path crates/hermes-gpui-spike/Cargo.toml --release \
            | tee results/gpui-hermes-spike/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-process-hermes-hbc-jsi-probe
          path: |
            crates/hermes-gpui-spike/Cargo.lock
            crates/hermes-gpui-spike/target/gpui-live-probe.hbc
            results/gpui-hermes-spike/runtime.log
          retention-days: 14
