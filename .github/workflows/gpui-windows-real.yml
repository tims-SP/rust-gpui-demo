name: Real Windows GPUI Hermes Svelte Solid windows
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gpui-windows-real.yml']
  workflow_dispatch:
    inputs:
      live_hermes:
        description: "Run in-process Hermes HBC / JSI / Rust Scene inside real GPUI windows"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
jobs:
  windows-real-window:
    if: ${{ !inputs.live_hermes }}
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: v1.29.3
          path: .zed-source
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: real-ibex2-hermes-framework-benchmarks
          run-id: 45199793980
          github-token: ${{ github.token }}
          path: results/hermes/
      - name: Overlay actual Hermes-generated scene viewer
        shell: bash
        run: |
          cp platforms/native/bench_view.rs .zed-source/crates/gpui/examples/hello_world.rs
          test -s results/hermes/svelte.json
          test -s results/hermes/solid.json
      - name: Compile official native GPUI executable on Windows
        shell: bash
        working-directory: .zed-source
        env:
          CARGO_BUILD_JOBS: '3'
        run: cargo build -p gpui --example hello_world
      - name: Try actual Windows GPUI window and capture desktop pixels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $out = Join-Path $env:GITHUB_WORKSPACE 'results/windows-gpui'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE '.zed-source/target/debug/examples/hello_world.exe'
          if (!(Test-Path $exe)) { throw "GPUI binary does not exist" }
          foreach ($f in @("svelte","solid")) {
            $env:HERMES_BENCH_JSON = Join-Path $env:GITHUB_WORKSPACE "results/hermes/$f.json"
            $stdout = Join-Path $out "$f-stdout.txt"
            $stderr = Join-Path $out "$f-stderr.txt"
            $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              $ready = $false
              for ($i=0; $i -lt 40; $i++) {
                Start-Sleep -Seconds 1
                if ((Test-Path $stdout) -and
                    ((Get-Content $stdout -Raw) -match 'GPUI_WINDOW_CREATED')) {
                  $ready = $true
                  break
                }
                if ($proc.HasExited) { break }
              }
              Get-Content $stdout -ErrorAction SilentlyContinue
              if (!$ready) { throw "Native Windows GPUI window was not created" }
              $log = Get-Content $stdout -Raw
              if ($log -notmatch "GPUI_IMPORTED_HERMES_SCENE_OK:$f") {
                throw "Incorrect Windows Hermes scene"
              }
              $metric = Join-Path $out "$f-metrics.json"
              for ($frame=0; $frame -lt 22; $frame++) {
                if ((Test-Path $stdout) -and ((Get-Content $stdout -Raw) -match "GPUI_REPLAY_BENCH_PASS:$f")) { break }
                if ($proc.HasExited) { break }
                Start-Sleep -Seconds 1
              }
              python tools/extract-gpui-replay.py --log $stdout --framework $f --platform windows --out $metric
              if ($LASTEXITCODE -ne 0) { throw "Native Windows replay metrics unavailable: $f" }
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
              $png = Join-Path $out "$f.png"
              $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
              $seen = New-Object 'System.Collections.Generic.HashSet[int]'
              for ($x=20; $x -lt $bounds.Width; $x+=13) {
                for ($y=20; $y -lt $bounds.Height; $y+=13) {
                  [void]$seen.Add($bmp.GetPixel($x,$y).ToArgb())
                }
              }
              $g.Dispose();$bmp.Dispose()
              if ($seen.Count -lt 24) { throw "Desktop screenshot is nearly blank: $($seen.Count) colors" }
              Write-Output "WINDOWS_GPUI_REAL_SCREENSHOT_PASS:$f colors=$($seen.Count)"
            } finally {
              if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          Write-Output 'WINDOWS_GPUI_TWO_REAL_WINDOWS_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gpui-svelte-solid-real-window-evidence
          path: results/windows-gpui/
          retention-days: 30
      - name: Stage runnable Windows replay debug package
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'results/windows-replay-package-debug'
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item '.zed-source/target/debug/examples/hello_world.exe' (Join-Path $pkg 'hello_world.exe')
          Get-ChildItem '.zed-source/target/debug/examples/*.dll' -ErrorAction SilentlyContinue | Copy-Item -Destination $pkg
          Copy-Item 'results/hermes/svelte.json' $pkg
          Copy-Item 'results/hermes/solid.json' $pkg
          @'
          param([string]$Framework = "svelte")
          $ErrorActionPreference = "Stop"
          $env:HERMES_BENCH_JSON = Join-Path $PSScriptRoot "$Framework.json"
          & (Join-Path $PSScriptRoot "hello_world.exe")
          '@ | Set-Content -Path (Join-Path $pkg 'run.ps1') -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpui-windows-replay-package-debug
          path: results/windows-replay-package-debug/
          retention-days: 14

  windows-live-hermes-window:
    if: ${{ inputs.live_hermes }}
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: v1.29.3
          path: .zed-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: live-svelte-solid-hermes-jsi-rust-scene
          run-id: 45295492997
          github-token: ${{ github.token }}
          path: results/live-hermes
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.97.0'
          cache: false
      - name: Install live Hermes GPUI view and validate HBC artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item platforms/native/bench_view.rs .zed-source/crates/gpui/examples/hello_world.rs
          $manifest = ".zed-source/crates/gpui/Cargo.toml"
          $content = Get-Content $manifest -Raw
          $dependency = 'gpui-hermes-live-spike = { path = "../../../crates/hermes-gpui-spike" }' + "`n"
          if (!$content.Contains($dependency)) {
            if (!$content.Contains("[dev-dependencies]")) { throw "GPUI Cargo.toml has no dev-dependencies section" }
            $content = $content.Replace("[dev-dependencies]", "[dev-dependencies]`n" + $dependency)
            Set-Content -Path $manifest -Value $content -NoNewline
          }
          $hbcDir = "results/live-hermes/crates/hermes-gpui-spike/target"
          foreach ($f in @("bootstrap.hbc","click.hbc","svelte.hbc","solid.hbc")) {
            if (!(Test-Path (Join-Path $hbcDir $f))) { throw "Missing HBC file: $f" }
          }
      - name: Compile official GPUI app with embedded Hermes and JSI bridge (debug + release)
        shell: bash
        working-directory: .zed-source
        env:
          CARGO_BUILD_JOBS: '3'
        run: |
          cargo build -p gpui --example hello_world
          cargo build -p gpui --example hello_world --release
      - name: Run real framework HBC in Windows GPUI windows and verify live JSI render callbacks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $out = Join-Path $env:GITHUB_WORKSPACE 'results/windows-live-hermes'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE '.zed-source/target/debug/examples/hello_world.exe'
          $hbcDir = Join-Path $env:GITHUB_WORKSPACE 'results/live-hermes/crates/hermes-gpui-spike/target'
          if (!(Test-Path $exe)) { throw "GPUI binary does not exist" }
          foreach ($f in @("svelte","solid")) {
            $env:HERMES_FRAMEWORK = $f
            $env:HERMES_BOOTSTRAP_HBC = Join-Path $hbcDir "bootstrap.hbc"
            $env:HERMES_CLICK_HBC = Join-Path $hbcDir "click.hbc"
            $env:HERMES_FRAMEWORK_HBC = Join-Path $hbcDir "$f.hbc"
            $stdout = Join-Path $out "$f-runtime.log"
            $stderr = Join-Path $out "$f-stderr.log"
            $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              $ready = $false
              for ($i=0; $i -lt 45; $i++) {
                Start-Sleep -Seconds 1
                if ((Test-Path $stdout) -and ((Get-Content $stdout -Raw) -match 'GPUI_WINDOW_CREATED')) {
                  $ready = $true
                  break
                }
                if ($proc.HasExited) { break }
              }
              if (!$ready) {
                Get-Content $stdout -ErrorAction SilentlyContinue
                Get-Content $stderr -ErrorAction SilentlyContinue
                throw "Windows GPUI failed to open live Hermes window for $f"
              }
              $log = Get-Content $stdout -Raw
              if ($log -notmatch "GPUI_LIVE_HERMES_VM_READY:$f") { throw "Missing live Hermes readiness marker for $f" }
              $pass = $false
              for ($frame=0; $frame -lt 35; $frame++) {
                if ((Test-Path $stdout) -and ((Get-Content $stdout -Raw) -match "GPUI_REPLAY_BENCH_PASS:$f")) {
                  $pass = $true
                  break
                }
                if ($proc.HasExited) { break }
                Start-Sleep -Seconds 1
              }
              if (!$pass) {
                Get-Content $stdout -Raw
                throw "Windows live Hermes Render callback gate failed for $f"
              }
              $metric = Join-Path $out "$f-metrics.json"
              python tools/extract-gpui-replay.py --log $stdout --framework $f --platform windows --out $metric
              if ($LASTEXITCODE -ne 0) { throw "Windows live Hermes metrics invalid: $f" }
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
              $png = Join-Path $out "$f.png"
              $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
              $seen = New-Object 'System.Collections.Generic.HashSet[int]'
              for ($x=20; $x -lt $bounds.Width; $x+=13) {
                for ($y=20; $y -lt $bounds.Height; $y+=13) {
                  [void]$seen.Add($bmp.GetPixel($x,$y).ToArgb())
                }
              }
              $g.Dispose(); $bmp.Dispose()
              if ($seen.Count -lt 24) { throw "Live GPUI screenshot is nearly blank: $($seen.Count) colors" }
              Write-Output "WINDOWS_GPUI_LIVE_HERMES_PIXELS_PASS:$f colors=$($seen.Count)"
            } finally {
              if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          Write-Output 'WINDOWS_GPUI_LIVE_HERMES_TWO_WINDOWS_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-live-hermes-svelte-solid-evidence
          path: results/windows-live-hermes/
          retention-days: 14
      - name: Stage runnable Windows live-Hermes debug package
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'results/windows-live-hermes-package-debug'
          $hbcDir = Join-Path $env:GITHUB_WORKSPACE 'results/live-hermes/crates/hermes-gpui-spike/target'
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'hbc') | Out-Null
          Copy-Item '.zed-source/target/debug/examples/hello_world.exe' (Join-Path $pkg 'hello_world.exe')
          Get-ChildItem '.zed-source/target/debug/examples/*.dll' -ErrorAction SilentlyContinue | Copy-Item -Destination $pkg
          foreach ($f in @("bootstrap.hbc","click.hbc","svelte.hbc","solid.hbc")) {
            Copy-Item (Join-Path $hbcDir $f) (Join-Path $pkg "hbc/$f")
          }
          @'
          param([string]$Framework = "svelte")
          $ErrorActionPreference = "Stop"
          $env:HERMES_FRAMEWORK = $Framework
          $env:HERMES_BOOTSTRAP_HBC = Join-Path $PSScriptRoot "hbc/bootstrap.hbc"
          $env:HERMES_CLICK_HBC = Join-Path $PSScriptRoot "hbc/click.hbc"
          $env:HERMES_FRAMEWORK_HBC = Join-Path $PSScriptRoot "hbc/$Framework.hbc"
          & (Join-Path $PSScriptRoot "hello_world.exe")
          '@ | Set-Content -Path (Join-Path $pkg 'run.ps1') -Encoding UTF8
          @'
          @echo off
          setlocal
          set FRAMEWORK=%~1
          if "%FRAMEWORK%"=="" set FRAMEWORK=svelte
          set HERMES_FRAMEWORK=%FRAMEWORK%
          set HERMES_BOOTSTRAP_HBC=%~dp0hbc\bootstrap.hbc
          set HERMES_CLICK_HBC=%~dp0hbc\click.hbc
          set HERMES_FRAMEWORK_HBC=%~dp0hbc\%FRAMEWORK%.hbc
          "%~dp0hello_world.exe"
          '@ | Set-Content -Path (Join-Path $pkg 'run.bat') -Encoding ASCII
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpui-windows-live-hermes-package-debug
          path: results/windows-live-hermes-package-debug/
          retention-days: 14
      - name: Stage runnable Windows live-Hermes release package
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'results/windows-live-hermes-package-release'
          $hbcDir = Join-Path $env:GITHUB_WORKSPACE 'results/live-hermes/crates/hermes-gpui-spike/target'
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'hbc') | Out-Null
          Copy-Item '.zed-source/target/release/examples/hello_world.exe' (Join-Path $pkg 'hello_world.exe')
          Get-ChildItem '.zed-source/target/release/examples/*.dll' -ErrorAction SilentlyContinue | Copy-Item -Destination $pkg
          foreach ($f in @("bootstrap.hbc","click.hbc","svelte.hbc","solid.hbc")) {
            Copy-Item (Join-Path $hbcDir $f) (Join-Path $pkg "hbc/$f")
          }
          @'
          param([string]$Framework = "svelte")
          $ErrorActionPreference = "Stop"
          $env:HERMES_FRAMEWORK = $Framework
          $env:HERMES_BOOTSTRAP_HBC = Join-Path $PSScriptRoot "hbc/bootstrap.hbc"
          $env:HERMES_CLICK_HBC = Join-Path $PSScriptRoot "hbc/click.hbc"
          $env:HERMES_FRAMEWORK_HBC = Join-Path $PSScriptRoot "hbc/$Framework.hbc"
          & (Join-Path $PSScriptRoot "hello_world.exe")
          '@ | Set-Content -Path (Join-Path $pkg 'run.ps1') -Encoding UTF8
          @'
          @echo off
          setlocal
          set FRAMEWORK=%~1
          if "%FRAMEWORK%"=="" set FRAMEWORK=svelte
          set HERMES_FRAMEWORK=%FRAMEWORK%
          set HERMES_BOOTSTRAP_HBC=%~dp0hbc\bootstrap.hbc
          set HERMES_CLICK_HBC=%~dp0hbc\click.hbc
          set HERMES_FRAMEWORK_HBC=%~dp0hbc\%FRAMEWORK%.hbc
          "%~dp0hello_world.exe"
          '@ | Set-Content -Path (Join-Path $pkg 'run.bat') -Encoding ASCII
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpui-windows-live-hermes-package-release
          path: results/windows-live-hermes-package-release/
          retention-days: 14
