name: Linux GPUIX same-bundle Hermes vs Bun/JSC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-compare.yml'
      - 'bench/engines/**'
      - 'scripts/run-hermes-case.sh'
      - 'bench/compare_engines.py'
      - 'scripts/run-hermes-case.sh'
      - 'scripts/build-hermes-cjs.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      XDG_SESSION_TYPE: x11
      WINIT_UNIX_BACKEND: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Linux Native and X11 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-xcb1 libxkbcommon-x11-0 libxkbcommon0 libwayland-client0 \
            libfontconfig1 libvulkan1 fonts-noto-cjk libasound2t64 libssl3
          mkdir -p results dist/engines
      - name: Install Hermes Node v0.0.2, verify sha256 before execution
        run: |
          set -euo pipefail
          url="https://github.com/tmikov/hermes-node/releases/download/v0.0.2/hermes-node-0.0.2-linux-x64.tar.gz"
          curl -fLSs --retry 3 "$url" -o hermes-node.tar.gz
          echo "56403274e5c5f24a58e84e15624bce473af1ab00d3bf60efc3f64a574614a4f7  hermes-node.tar.gz" | sha256sum -c -
          mkdir -p .tools/hermes
          tar xzf hermes-node.tar.gz -C .tools/hermes
          executable="$(find "$PWD/.tools/hermes" -type f -name hermes-node | head -n 1)"
          test -n "$executable"
          chmod +x "$executable"
          echo "HERMES_NODE=$executable" >> "$GITHUB_ENV"
          "$executable" --version
          "$executable" -e 'console.log("HERMES_SMOKE",process.execPath,process.versions)'
      - name: Install app packages
        run: bun install
      - name: Verify same GPUIX Node-API addon loads in both engines
        run: |
          set -euo pipefail
          export NODE_PATH="$PWD/node_modules"
          bun -e 'const x=require("@gpuix/native"); if(typeof x.GpuixRenderer!=="function")throw Error("Bun cannot load Native"); console.log("Bun Node-API OK")'
          "$HERMES_NODE" -e 'const x=require("@gpuix/native"); if(typeof x.GpuixRenderer!=="function")throw Error("Hermes cannot load Native"); console.log("Hermes Node-API OK")'
      - name: Build exactly one CommonJS file per framework
        run: |
          set -euo pipefail
          bun scripts/build-hermes-cjs.ts
          for fw in solid svelte; do
            perl -pi -e 's/\bimport\(/require(/g' "dist/engines/$fw.cjs"
            echo "$fw byte length: $(wc -c < dist/engines/$fw.cjs)"
            if grep -Eq '\bimport\(' "dist/engines/$fw.cjs"; then exit 1; fi
          done
          sha256sum dist/engines/*.cjs | tee results/bundle-sha256.txt
      - name: Precompile the exact same JS bundles into Hermes bytecode
        run: |
          set -euo pipefail
          # hermes-node 0.0.2 bundler ignores package.exports.require and reads package.main.
          # Point only the CI-installed dependency manifest at its existing CJS entry.
          # The JS bundles themselves, .node binding and source remain unchanged.
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=Path('node_modules/@gpuix/native/package.json')
          pkg=json.loads(manifest.read_text())
          require_entry=pkg['exports']['.']['require']
          assert require_entry=='./index.cjs'
          assert (manifest.parent/require_entry).exists()
          pkg['main']=require_entry
          manifest.write_text(json.dumps(pkg,indent=2))
          print('Hermes bundle package main now:',pkg['main'])
          PY
          for fw in solid svelte; do
            "$HERMES_NODE" --build-bundle="dist/engines/$fw.bundle" "dist/engines/$fw.cjs" \
              2>&1 | tee "results/hermes-aot-build-$fw.log"
            test -s "dist/engines/$fw.bundle"
            sha256sum "dist/engines/$fw.bundle"
          done
          echo "Hermes failing location diagnostic (solid.cjs:1435-1465)"
          awk 'NR>=1435 && NR<=1465 {printf "%d %s\\n",NR,$0}' dist/engines/solid.cjs
          grep -nE 'require\\(' dist/engines/solid.cjs | head -n 35 || true
      - name: Inspect produced AOT bytecode (not native machine code)
        run: |
          set -euo pipefail
          for fw in solid svelte; do
            bundle="dist/engines/$fw.bundle"
            "$HERMES_NODE" "--bundle=$bundle" --dump > "results/hermes-$fw-bundle-dump.txt"
            entry="$(python3 - "$bundle" "results/hermes-$fw-bundle-dump.txt" <<'PY'
          import re, sys
          dump=open(sys.argv[2]).read()
          m=re.search(r"^entry:\s+\[\d+\]\s+(.+)$",dump,re.M)
          assert m, "Could not determine bytecode entry: "+sys.argv[1]
          assert "MODULES (" in dump and " js " in dump, "Missing JS bytecode modules"
          assert m.group(1).endswith(".cjs"), "Expected bundled CJS: "+repr(m.group(1))
          print(m.group(1).strip())
          PY
            )"
            "$HERMES_NODE" "--bundle=$bundle" "--extract-module=$entry" \
              "--out=results/hermes-$fw-entry.hbc"
            test -s "results/hermes-$fw-entry.hbc"
            "$HERMES_NODE" "--dump-bytecode=results/hermes-$fw-entry.hbc" \
              > "results/hermes-$fw-bytecode-disassembly.txt"
            grep -Fq "Byte range of each section in bytecode:" \
              "results/hermes-$fw-bytecode-disassembly.txt"
            head -n 100 "results/hermes-$fw-bytecode-disassembly.txt" \
              > "results/hermes-$fw-bytecode-proof.txt"
            rm "results/hermes-$fw-bytecode-disassembly.txt"
            sha256sum "$bundle" "results/hermes-$fw-entry.hbc" \
              | tee "results/hermes-$fw-bytecode-sha256.txt"
            echo "Verified prebuilt optimized bytecode for $fw (NOT Static Hermes native code)"
          done
      - name: Run both compiled applications in both engines, 3 native trials
        run: |
          set -euo pipefail
          for trial in 0 1 2; do
            if (( trial % 2 == 0 )); then engines=(bun hermes hermes-opt hermes-aot); else engines=(hermes-aot hermes-opt hermes bun); fi
            for engine in "${engines[@]}"; do
              for fw in solid svelte; do
                echo "::group::engine=$engine framework=$fw trial=$trial"
                xvfb-run -a -s "-screen 0 1280x950x24" \
                  timeout 120s bash scripts/run-hermes-case.sh "$engine" "$fw" "$trial"
                echo "::endgroup::"
              done
            done
          done
      - name: Aggregate verified numbers
        run: |
          python3 bench/compare_engines.py
          cat results/HERMES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload all reports, source checksums, logs and real X11 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-vs-bun-linux-native
          path: |
            results/
            dist/engines/*.cjs
          retention-days: 30
