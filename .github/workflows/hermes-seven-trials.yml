name: Seven-trial paired native Hermes HBC Svelte and Solid benchmarks
on:
  push:
    branches: [main]
    paths:
      - 'tools/hermes-seven-trials.sh'
      - 'tools/hermes-perf-report.py'
      - '.github/workflows/hermes-seven-trials.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  hermes-seven-trials:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: expo/ibex
          ref: 24cd0ae8cdd20106bed04cd3a4a2378d1dd81995
          path: .ibex-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.97.0'
          cache: false
      - name: Prepare real Rust Ibex2 Hermes, bytecode and toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libicu-dev pkg-config time
          npm install --no-audit --no-fund
          npm run build
      - name: Compile actual Ibex2 native runtime
        env:
          RUSTFLAGS: '-A mismatched-lifetime-syntaxes'
        run: cargo build --manifest-path .ibex-source/Cargo.toml --locked --release -p ibex2-runtime --bin ibex2
      - name: Warmup then seven alternating independent engine processes
        run: bash tools/hermes-seven-trials.sh
      - name: Archive raw samples, host info and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-seven-trial-svelte-solid-process-benchmark
          path: results/perf/
          retention-days: 30
