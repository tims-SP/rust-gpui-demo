name: Isolate Svelte scoped CSS caching and raw list proxy cost

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-proxy-isolation.yml'
      - 'bench/SvelteGlobalTheme.svelte'
      - 'bench/SvelteRawList.svelte'
      - 'bench/cache_proxy_compare.py'
      - 'bench/solid.tsx'
      - 'bench/svelte.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      XDG_SESSION_TYPE: x11
      WINIT_UNIX_BACKEND: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      THEME_ISOLATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Mesa Vulkan and X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-xcb1 libxkbcommon-x11-0 libxkbcommon0 libwayland-client0 \
            libfontconfig1 libvulkan1 fonts-noto-cjk libasound2t64 libssl3
          mkdir -p results
      - name: Install dependencies
        run: bun install
      - name: Four trials each (scoped theme, shared rule cache, raw list, Solid)
        run: |
          set -euo pipefail
          for trial in 0 1 2 3; do
            export BENCH_TRIAL="$trial"
            if (( trial % 2 == 0 )); then
              variants=(scoped global raw solid)
            else
              variants=(solid raw global scoped)
            fi
            for variant in "${variants[@]}"; do
              export BENCH_CASE="$variant"
              echo "::group::variant=$variant trial=$trial"
              if [ "$variant" = solid ]; then
                xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                  bun --preload @gpuix/solid/preload bench/solid.tsx 2>&1 | tee "results/$variant-$trial.log"
              else
                export SVELTE_STYLE_MODE="$variant"
                xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                  bun --conditions custom-renderer --preload gpuix-svelte/plugin \
                  bench/svelte.ts 2>&1 | tee "results/$variant-$trial.log"
                unset SVELTE_STYLE_MODE
              fi
              echo "::endgroup::"
            done
          done
      - name: Verify native correctness and analyze mechanism deltas
        run: |
          python3 bench/cache_proxy_compare.py
          cat results/CACHE_PROXY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw json and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-svelte-cache-proxy-isolation
          path: results/
          retention-days: 30
