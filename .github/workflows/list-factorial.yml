name: Factorial Svelte list proxy and window-slice cost

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/list-factorial.yml'
      - 'bench/SvelteRawOrder.svelte'
      - 'bench/SvelteIndexedWindow.svelte'
      - 'bench/list_factorial_compare.py'
      - 'bench/svelte.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      XDG_SESSION_TYPE: x11
      WINIT_UNIX_BACKEND: x11
      LIBGL_ALWAYS_SOFTWARE: "1"
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      THEME_ISOLATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Linux GPU software renderer and X11
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-xcb1 libxkbcommon-x11-0 libxkbcommon0 libwayland-client0 \
            libfontconfig1 libvulkan1 fonts-noto-cjk libasound2t64 libssl3
          mkdir -p results
      - name: Install dependencies
        run: bun install
      - name: Warm and test four list variants and Solid reference
        run: |
          set -euo pipefail
          for trial in 0 1 2 3; do
            export BENCH_TRIAL="$trial"
            if (( trial % 2 == 0 )); then
              variants=(scoped raw-order indexed-window raw solid)
            else
              variants=(solid raw indexed-window raw-order scoped)
            fi
            for variant in "${variants[@]}"; do
              export BENCH_CASE="$variant"
              echo "::group::variant=$variant trial=$trial"
              if [ "$variant" = solid ]; then
                xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                  bun --preload @gpuix/solid/preload bench/solid.tsx \
                  2>&1 | tee "results/$variant-$trial.log"
              else
                export SVELTE_STYLE_MODE="$variant"
                xvfb-run -a -s "-screen 0 1280x950x24" timeout 150s \
                  bun --conditions custom-renderer --preload gpuix-svelte/plugin bench/svelte.ts \
                  2>&1 | tee "results/$variant-$trial.log"
                unset SVELTE_STYLE_MODE
              fi
              echo "::endgroup::"
            done
          done
      - name: Verify original and new variants with native state and screenshots
        run: |
          python3 bench/list_factorial_compare.py
          cat results/LIST_FACTORIAL.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw results and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-svelte-list-factorial
          path: results/
          retention-days: 30
